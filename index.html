<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Tracker — JMR Martinez Trucking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100vh; background: #e8eef2; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: white; border-radius: 8px; padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 300px;
  }
  #panel h2 { margin: 0 0 8px; font-size: 16px; }
  .truck { border-top: 1px solid #eee; padding: 6px 0; font-size: 14px; }
  .stale { color: #a00; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h2>🚛 JMR Martinez Trucking</h2>
  <div id="trucks"><em>Esperando datos…</em></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBeD3RfH2SgJcR0khCwz6hWgJRPRI5_VeY",
  authDomain: "fleet-tracker-jmr-a82c1.firebaseapp.com",
  databaseURL: "https://fleet-tracker-jmr-a82c1-default-rtdb.firebaseio.com",
  projectId: "fleet-tracker-jmr-a82c1"
};

const COMPANY_ID = "jmr-martinez";
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const map = L.map('map').setView([32.7767, -96.7970], 10); // Dallas, TX

// Mapa base: OpenStreetMap
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

const markers = {};
let centered = false;

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return `hace ${s} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `hace ${m} min`;
  return `hace ${Math.floor(m / 60)} h`;
}

db.ref(`companies/${COMPANY_ID}/trucks`).on('value', (snap) => {
  const trucks = snap.val() || {};
  const list = document.getElementById('trucks');
  list.innerHTML = '';
  const ids = Object.keys(trucks);

  if (!ids.length) {
    list.innerHTML = '<em>Sin camiones reportando.</em>';
    return;
  }

  const bounds = [];
  ids.forEach((id) => {
    const live = trucks[id].live;
    if (!live || !live.lat) return;
    bounds.push([live.lat, live.lng]);

    const stale = Date.now() - live.updatedAt > 5 * 60 * 1000;
    const kmh = live.speed ? (live.speed * 3.6).toFixed(0) : '0';

    if (markers[id]) {
      markers[id].setLatLng([live.lat, live.lng]);
    } else {
      markers[id] = L.marker([live.lat, live.lng]).addTo(map)
        .bindPopup(`<b>${id}</b><br>Chofer: ${live.driver || '-'}`);
    }

    const div = document.createElement('div');
    div.className = 'truck' + (stale ? ' stale' : '');
    div.innerHTML = `<b>${id}</b> — ${live.driver || '-'}<br>` +
      `🚚 ${kmh} km/h · ${timeAgo(live.updatedAt)}${stale ? ' (sin señal)' : ''}`;
    div.onclick = () => map.setView([live.lat, live.lng], 15);
    list.appendChild(div);
  });

  // Centra el mapa en tus camiones la primera vez que llegan datos
  if (bounds.length && !centered) {
    centered = true;
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  }
});
</script>
</body>
</html>
